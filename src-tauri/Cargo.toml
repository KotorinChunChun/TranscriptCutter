[package]
name = "transcript-cutter"
version = "0.2611.0"
edition = "2021"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls", "query"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

